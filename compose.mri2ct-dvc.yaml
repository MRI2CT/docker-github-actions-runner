# Optional override: mount MRI2CT's shared DVC cache NFS share into every
# replica, read/write, at the same path DVC itself expects (see
# `.dvc/config` in target repos: `cache.dir = /mri2ct/dvc-cache`,
# `cache.shared = group`).
#
# Only needed for workflows that run `dvc checkout`/`dvc pull` directly on
# this fleet WITHOUT a registry/S3 fallback (e.g. mri2ct's bundles.yml,
# reg2d3d-api.yml) -- most repos/workflows don't need this at all, which is
# why it's a separate opt-in file rather than part of the base compose.yaml.
#
# The host running this must already have /mri2ct mounted (NFS or
# otherwise) -- this file does not mount it on the host, only bind-mounts
# whatever is already there into the container.
#
# Usage:
#   docker compose -f compose.yaml -f compose.mri2ct-dvc.yaml up -d --build
# Komodo: add this as an additional compose file path on the Stack
# alongside compose.yaml.
#
# Note: this gives every replica of the fleet read/write access to the
# whole shared /mri2ct data store, not just the DVC cache subdirectory --
# only include this file for fleets whose label is restricted to workflows
# that are meant to have that access.
services:
  runner:
    volumes:
      - /mri2ct:/mri2ct
